[profile.default]
src = "contracts"
out = "out"
test = "test"
script = "script"
# Dependensi Solidity diinstal sendiri (`npm install` di folder ini): OZ 5.1.0 + forge-std.
# Repo ini tidak menggantung pada direktori di luar dirinya — yang meng-clone tidak
# memilikinya, dan build harus bisa diulang dari satu folder.
libs = ["node_modules", "lib"]
solc_version = "0.8.26"
# Default rendah: bytecode jalan di lebih banyak chain. Kontrak runeDAO tidak menyentuh
# opcode Cancun, dan tidak ada satu pun tes yang butuh state chain pihak ketiga — suite-nya
# murni lokal (lihat [fuzz]).
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
verbosity = 2
# `Stack too deep` di `RuneWorld.resolve()` pada event `Action` (11 argumen) — dan event ini
# sengaja lebar: halaman dunia harus bisa dibangun dari log saja, tanpa satu RPC tambahan per
# aksi. Alternatifnya memangkas argumen event, dan itu memindahkan biaya ke pembaca.
# viaIR dipakai di profil DEFAULT dan FORK supaya bytecode yang diuji = bytecode yang dideploy.
viaIR = true

# Profil untuk tes yang membaca state chain NYATA (mis. membuktikan VRF/ERC-8004 tersedia di
# 97 sebelum ada yang mengklaimnya). Kontrak pihak ketiga di chain itu dikompilasi dengan
# target lebih baru daripada shanghai; fork di profil default gagal dengan
# `EvmError: NotActivated`. Sampai catatan ini ditulis belum ada tes yang memakai profil ini,
# dan itu pilihan, bukan kelalaian: semua aturan proyek ini bisa ditegakkan tanpa chain lain.
[profile.fork]
src = "contracts"
out = "out"
test = "test"
script = "script"
libs = ["node_modules", "lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
viaIR = true
verbosity = 2

[rpc_endpoints]
# Diukur dari mesin pengembangan pada 23 Sep 2026, dan perilaku ini berubah tanpa pemberitahuan:
#   - bsc-testnet.publicnode.com  : paling stabil; sempat membalas HTTP 520 satu kali di tengah
#                                   sebuah script yang sedang menyiarkan
#   - bsc-testnet.drpc.org        : HTTP 408 "Request timeout on the free plan" saat burst
#   - data-seed-prebsc-1-s1..s3   : ditolak / timeout
#   - bsc-dataseed.binance.org    : sertifikat ditolak Foundry (expired)
# Jadi: dua kandidat pertama dipakai bergantian, dan runtime agen membaca ulang head sebelum
# menghitung target blok (lihat agent/rune-agent.mjs, catatan (c)).
bscTestnet = "https://bsc-testnet.publicnode.com"
bscTestnetAlt = "https://bsc-testnet-rpc.publicnode.com"
bscTestnetD = "https://bsc-testnet.drpc.org"
bsc = "https://bsc-dataseed1.bnbchain.org/"

[fuzz]
runs = 256
